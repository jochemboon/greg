[package]
name = "slate"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "wayland", "x11"] }
ropey = "1.6.1"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
toml = "1.2.1"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
